<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>4:6 Coffee Timer</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4ca1af">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2c3e50, #4ca1af);
      font-family: "Helvetica Neue", sans-serif;
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 22px;
    }

    #time {
      font-size: 42px;
      margin: 15px 0;
    }

    #step {
      font-size: 18px;
      opacity: 0.9;
      min-height: 1.2em;
    }

    #amount {
      font-size: 20px;
      margin-top: 10px;
      color: #ffd166;
    }

    #total {
      font-size: 20px;
      color: #06d6a0;
    }

    .setting-group {
      margin-top: 15px;
      text-align: left;
    }

    .setting-label {
      font-size: 14px;
      margin-bottom: 5px;
      display: block;
      opacity: 0.8;
    }

    input,
    select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 16px;
      box-sizing: border-box;
    }

    option {
      background: #2c3e50;
    }

    button {
      margin-top: 25px;
      padding: 12px 40px;
      border: none;
      border-radius: 30px;
      background: #ffd166;
      color: #333;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    button:hover {
      background: #ffb703;
    }

    #waterTotal {
      font-size: 14px;
      margin-top: 10px;
      color: #06d6a0;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>4:6 Coffee Timer</h1>

    <div class="setting-group">
      <span class="setting-label">豆の量 (g)</span>
      <input id="beans" type="number" value="20" min="1">
    </div>

    <div class="setting-group">
      <span class="setting-label">味の調整 (前半40%)</span>
      <select id="taste">
        <option value="60">酸味寄り</option>
        <option value="50" selected>標準 (バランス)</option>
        <option value="40">甘味寄り</option>
      </select>
    </div>

    <div class="setting-group">
      <span class="setting-label">濃さの調整 (後半60%)</span>
      <select id="pours">
        <option value="1">すっきり (1回注ぐ)</option>
        <option value="2">普通 (2回注ぐ)</option>
        <option value="3" selected>濃いめ (3回注ぐ)</option>
      </select>
    </div>

    <div id="waterTotal"></div>

    <div id="time">00:00</div>
    <div id="step">待機中</div>
    <div id="amount">今回: 0 ml</div>
    <div id="total">合計: 0 ml</div>
    <button onclick="startTimer()">スタート</button>
  </div>

  <script>
    // 音を鳴らす（Web Audio API）
      function beep() {
        // 音と振動を制御する関数
        function notify() {
          // 1. 音を鳴らす（既存の処理）
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = 800;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);

          // 2. 振動させる（追加部分）
          if ("vibrate" in navigator) {
            // 200ミリ秒間振動させる
            navigator.vibrate(200);

            // パターンで振動させたい場合（例：200ms振動、100ms休憩、200ms振動）
            // navigator.vibrate([200, 100, 200]);
          }
        }
      }

      // 分:秒 の形式にフォーマットする関数
      function formatTime(totalSeconds) {
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        return String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
      }

      function generateSteps(beans, tasteRatio, pours) {
        const totalWater = beans * 15;
        const firstPart = totalWater * 0.4;
        const secondPart = totalWater * 0.6;

        const first1 = firstPart * (tasteRatio / 100);
        const first2 = firstPart * ((100 - tasteRatio) / 100);
        const secondAmountEach = secondPart / pours;

        let steps = [];

        // 「濃いめ（3回）」の場合の特殊スケジュール
        if (pours === 3) {
          steps = [
            { time: 0, text: "1投目（蒸らし）", amount: Math.round(first1) },
            { time: 45, text: "2投目（味調整）", amount: Math.round(first2) },
            { time: 90, text: "後半 1投目 (濃さ調整)", amount: Math.round(secondAmountEach) }, // 1:30
            { time: 130, text: "後半 2投目 (濃さ調整)", amount: Math.round(secondAmountEach) }, // 2:10
            { time: 160, text: "後半 3投目 (濃さ調整)", amount: Math.round(secondAmountEach) }, // 2:40
            { time: 210, text: "終了（ドリッパーを外す）", amount: 0 }                      // 3:30
          ];
        } else {
          // すっきり(1回)・普通(2回)は45秒間隔
          steps = [
            { time: 0, text: "1投目（蒸らし）", amount: Math.round(first1) },
            { time: 45, text: "2投目（味調整）", amount: Math.round(first2) }
          ];
          for (let i = 0; i < pours; i++) {
            steps.push({
              time: 90 + i * 45,
              text: `後半 ${i + 1}投目 (濃さ調整)`,
              amount: Math.round(secondAmountEach)
            });
          }
          steps.push({
            time: 90 + pours * 45,
            text: "終了（ドリッパーを外す）",
            amount: 0
          });
        }
        return { steps, totalWater };
      }

      let timer;
      let steps = [];

      function startTimer() {
        const beans = parseFloat(document.getElementById("beans").value);
        const tasteRatio = parseInt(document.getElementById("taste").value);
        const pours = parseInt(document.getElementById("pours").value);

        if (!beans || beans <= 0) {
          alert("豆の量を入力してください");
          return;
        }

        const result = generateSteps(beans, tasteRatio, pours);
        steps = result.steps;
        document.getElementById("waterTotal").innerText = `総湯量: ${Math.round(result.totalWater)} ml`;

        const startTime = Date.now();
        let index = -1;
        let currentTotal = 0;

        clearInterval(timer);
        timer = setInterval(() => {
          let elapsed = Math.floor((Date.now() - startTime) / 1000);

          // 表示を 00:00 形式に変更
          document.getElementById("time").innerText = formatTime(elapsed);

          if (index < steps.length - 1 && elapsed >= steps[index + 1].time) {
            index++;
            let s = steps[index];
            currentTotal += s.amount;

            document.getElementById("step").innerText = s.text;
            document.getElementById("amount").innerText = "今回: " + s.amount + " ml";
            document.getElementById("total").innerText = "合計: " + currentTotal + " ml";

            beep();
            if (s.text.includes("終了")) {
              clearInterval(timer);
            }
          }
        }, 200);
      }
  </script>
</body>

</html>
